# DomainSecurity 域名安全校验插件配置文件
# 
# 重要说明：
# - 插件校验的是服务器实际收到的连接地址（来自Minecraft握手包）
# - 如果您的域名配置了SRV记录解析（如 mc.example.com 解析到 mc1.example.com）
#   请在 allowed-domains 中填写 SRV记录指向的目标域名（如 mc1.example.com）
# - 客户端输入的域名经过DNS SRV解析后，服务器收到的是解析后的地址
# - 示例：若您设置了 _minecraft._tcp.mc.example.com SRV记录指向 mc1.example.com
#   玩家输入 mc.example.com 连接时，服务器收到的是 mc1.example.com
#   因此需要将 mc1.example.com 添加到 allowed-domains 中

# 域名校验配置
domain:
  # 放行的域名列表（精确匹配）
  # 注意：如果使用了SRV解析，请填写SRV记录指向的目标域名
  # 例如：mc.example.com 的SRV记录指向 mc1.example.com，则应填写 mc1.example.com
  allowed-domains:
    - "mc.example.com"
    - "mc.example.net"
    - "mc2.example.com"
  
  # 禁止的二级域名列表（直接踢出）
  # 黑名单中的域名优先级高于白名单
  blocked-domains:
    - "mc1.example.com"

# 踢出弹窗配置
kick-message:
  # 是否启用踢出功能
  enabled: true
  
  # 踢出弹窗标题（第一行，加粗红色）
  title: "§c§lServer 安全拦截"
  
  # 分隔线
  separator: "---------------------------------------"
  
  # 踢出原因（红色带叉号）
  reason: "§c✘ 连接地址无效"
  
  # 详细说明（灰色）
  description:
    - ""
    - "§7您使用了错误的连接地址"
    - "§7当前玩家：§e%player%"
    - "§7当前连接地址：§e%host%"
    - ""
    - "§b☄ 如何解决？"
    - "§7请使用服务器指定的域名连接"
  
  # 底部分隔线
  footer-separator: "---------------------------------------"

# 玩家白名单配置
whitelist:
  # 允许使用IP地址登录的玩家列表
  # 这些玩家可以直接通过IP地址（如 192.168.1.100）连接服务器
  # 注意：普通玩家通过IP连接会被拦截
  allowed-players:
    - "AdminPlayer"
    - "Developer"

# 连接频率限制配置
rate-limit:
  # 是否启用频率限制
  enabled: true
  
  # 时间窗口（秒）- 在这个时间内统计失败次数
  time-window-seconds: 10
  
  # 最大失败次数 - 超过此次数将被拉黑
  max-failures: 5
  
  # 拉黑时长（分钟）
  blacklist-duration-minutes: 5

# 日志配置
logging:
  # 是否记录拦截日志
  log-blocked: true
  
  # 是否记录放行日志
  log-allowed: true
  
  # 是否记录拉黑日志
  log-blacklisted: true
